scenes.forEach((s,i)=>{s.start=i*4;s.dur=4;});
function kineticTitle(index,t){
 const beat=t<1.15?0:t<2.65?1:2,elapsed=t-[0,1.15,2.65][beat];
 const title=$('h1'),key=index+':'+beat;
 if(title.dataset.beat!==key){title.innerHTML=phrases[index][beat];title.dataset.beat=key;}
 const enter=out(elapsed/.28),spring=1-Math.exp(-elapsed*11)*Math.cos(elapsed*15);
 title.style.opacity=enter;title.style.transform=`translateY(${(1-enter)*22}px)`;
 const em=title.querySelector('em');if(em){em.style.display='inline-block';em.style.transform=`scale(${.72+.28*spring})`;em.style.transformOrigin='center';}
}
let current=0,playing=false,origin=0,raf=0;
function renderAt(time){
 current=clamp(Number(time)||0,0,DURATION);
 const s=scenes.find(s=>current>=s.start&&current<s.start+s.dur)||scenes.at(-1),index=scenes.indexOf(s),t=current-s.start;
 dust(current);ctx.clearRect(0,0,W,H);s.render(t*1.5);renderer.render(world,camera);
 $('#eyebrow').textContent=s.tag;kineticTitle(index,t);
 $('#desc').textContent=s.desc;$('#desc').style.opacity=ease((t-.55)/.3)*.7;
 $('#copy').style.opacity=1;$('#copy').style.transform='none';
 $('#subtitle').textContent=captions[index][t<2?0:1];
 document.querySelectorAll('#chapter b').forEach((el,i)=>el.style.width=clamp((current-scenes[i].start)/4)*100+'%');
 $('#seek').value=current;$('#time').textContent=`00:${String(Math.floor(current)).padStart(2,'0')} / 00:32`;return current;
}
window.renderAt=renderAt;
function pause(){playing=false;cancelAnimationFrame(raf);$('#play').textContent='播放';$('#start').style.display=capture?'none':'block';$('#start').textContent=current>=DURATION?'↻ 重新播放':'▶ 继续播放';}
function tick(now){if(!playing)return;renderAt((now-origin)/1000);if(current>=DURATION){pause();return;}raf=requestAnimationFrame(tick);}
function play(){if(current>=DURATION)current=0;$('#start').style.display='none';playing=true;origin=performance.now()-current*1000;$('#play').textContent='暂停';raf=requestAnimationFrame(tick);}
$('#start').onclick=()=>play();$('#film').onclick=()=>{if(!capture)playing?pause():play();};$('#play').onclick=()=>playing?pause():play();$('#restart').onclick=()=>{pause();renderAt(0);play();};$('#seek').oninput=e=>{pause();renderAt(+e.target.value);};document.addEventListener('keydown',e=>{if(e.code==='Space'&&e.target.tagName!=='INPUT'){e.preventDefault();playing?pause():play();}if(e.code==='ArrowRight'){pause();renderAt(current+1);}if(e.code==='ArrowLeft'){pause();renderAt(current-1);}});
function resize(){let s=Math.min(innerWidth/W,innerHeight/H);$('#shell').style.width=W*s+'px';$('#shell').style.height=H*s+'px';$('#film').style.transform=`scale(${s})`;}addEventListener('resize',resize);resize();
const query=new URLSearchParams(location.search),capture=query.has('capture');if(capture)document.body.classList.add('capture');window.ready=(async()=>{await Promise.race([Promise.all([document.fonts.load('500 77px "Noto Serif SC"'),document.fonts.load('24px "IBM Plex Mono"')]),new Promise(resolve=>setTimeout(resolve,4000))]);renderAt(+(query.get('t')||0));$('#start').disabled=false;$('#start').textContent='▶ 点击播放';document.fonts.ready.then(()=>{if(!playing)renderAt(current);});return true;})();
