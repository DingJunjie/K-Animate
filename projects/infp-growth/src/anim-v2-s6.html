<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>INFP v2 · 段 6 动画</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#05080e}
#stage{position:absolute;left:50%;top:50%;transform-origin:0 0}
#cv{display:block}
#ui{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;align-items:center;padding:8px 12px;background:#0e1624e6;color:#ddd;font:12px Menlo,monospace;z-index:9}
#ui button{background:#1c2a40;color:#ddd;border:1px solid #ffffff33;border-radius:4px;padding:5px 9px;cursor:pointer}
#ui input{flex:1}
.capture #ui{display:none}
</style>
</head>
<body>
<div id="stage"><canvas id="cv"></canvas></div>
<div id="ui">
  <button id="play">播放</button>
  <input id="seek" type="range" min="0" max="12.4" step="0.01" value="0" aria-label="时间轴">
  <span id="time">0.00s</span>
  <button id="ratio">9:16</button>
</div>
<script>
// ---- 色板 ----
const BG='#0E1624',INK='#9FB1C9',BRASS='#C9A45C',RED='#C8553D';
const SERIF='"Noto Serif SC","Songti SC","STSong",serif',MONO='"IBM Plex Mono",Menlo,monospace';
// 时间映射：刻度段（故事时间 0–SLOW）放慢 TS 倍，旋转之后恢复原速
const SLOW=2.4,TS=2,D=10+SLOW*(TS-1);
const story=t=>t<SLOW*TS?t/TS:t-SLOW*(TS-1);

// ---- 参数：?ratio=9x16|16x9  ?capture  ?t= ----
const q=new URLSearchParams(location.search);
if(q.has('capture'))document.body.classList.add('capture');
let RATIO=q.get('ratio')==='16x9'?'16x9':'9x16';
const cv=document.getElementById('cv'),c=cv.getContext('2d');
let W=1080,H=1920;const V=()=>RATIO==='9x16';

// ---- 工具 ----
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>{x=clamp(x);return x*x*(3-2*x)};
const span=(t,a,b)=>clamp((t-a)/(b-a));
const mix=(a,b,p)=>a+(b-a)*p;
function rng(s){return()=>{s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function line(x1,y1,x2,y2){c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke()}
function circle(x,y,r){c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.stroke()}
function glow(col,b){c.shadowColor=col;c.shadowBlur=b}
function noGlow(){c.shadowBlur=0}

// 背景：墨蓝底 + 暗角 + 颗粒（固定种子，截帧一致）
function bg(){
  c.fillStyle=BG;c.fillRect(0,0,W,H);
  const g=c.createRadialGradient(W/2,H*.4,0,W/2,H*.4,Math.max(W,H)*.75);
  g.addColorStop(0,'#16223500');g.addColorStop(1,'#03060bcc');
  c.fillStyle=g;c.fillRect(0,0,W,H);
  const r=rng(6);c.fillStyle='#ffffff';
  for(let i=0;i<2600;i++){c.globalAlpha=r()*.05;c.fillRect(r()*W,r()*H,1.2,1.2)}
  c.globalAlpha=1;
}
// 字幕：a 为透明度，dy 为上浮偏移；9:16 基线与风格帧一致
function sub(rows,a,dy=0){
  if(a<=0)return;
  const fs=V()?50:40,lh=fs*1.55,bottom=V()?H*.76+50:H*.9;
  c.font='600 '+fs+'px '+SERIF;c.textAlign='center';c.textBaseline='alphabetic';
  c.fillStyle='#E8E2D4';c.globalAlpha=a;
  rows.forEach((s,i)=>c.fillText(s,W/2,bottom-(rows.length-1-i)*lh+dy));
  c.globalAlpha=1;
}
// 字幕区间：[t0,t1] 内淡入上浮、淡出
function cue(t,t0,t1,rows){const a=Math.min(span(t,t0,t0+.45),span(t,t1,t1-.35));sub(rows,a,(1-ease(span(t,t0,t0+.45)))*12)}
function note(s,a=1){
  c.font='500 22px '+MONO;c.textAlign='left';c.textBaseline='top';
  c.fillStyle=INK;c.globalAlpha=.6*a;c.fillText(s,V()?W*.08:W*.05,V()?H*.13:H*.07);c.globalAlpha=1;
}
// ---- 段 6 · 尺子变罗盘（状态只由 t 决定）----
function draw(t){
  const cx=W/2,cy=V()?H*.43:H*.45,R=V()?300:260,ly=V()?H*.22:H*.16,st=W/12;
  const p=ease(span(t,2.4,5.4)),dec=-11*Math.PI/180,aT=-Math.PI/2+dec;
  // 海图网格
  const ga=span(t,5.4,7);
  if(ga>0){c.strokeStyle=INK;c.lineWidth=1;c.globalAlpha=.12*ga;
    for(let x=st/2;x<W;x+=st)line(x,0,x,H);for(let y=st/2;y<H;y+=st)line(0,y,W,y);c.globalAlpha=1}
  // 罗盘外圈：顺时针画出
  const rp=ease(span(t,3.6,5.8));
  if(rp>0){c.strokeStyle=INK;c.lineWidth=1.5;const a0=-Math.PI/2,a1=a0+Math.PI*2*rp;
    c.beginPath();c.arc(cx,cy,R,a0,a1);c.stroke();c.beginPath();c.arc(cx,cy,R*.82,a0,a1);c.stroke();
    c.lineWidth=1;for(let i=0;i<72*rp;i++){const a=a0+i/72*Math.PI*2,r2=i%18===0?R*.84:i%2===0?R*.9:R*.94;line(cx+Math.cos(a)*R,cy+Math.sin(a)*R,cx+Math.cos(a)*r2,cy+Math.sin(a)*r2)}
    c.font='500 26px '+MONO;c.fillStyle=INK;c.textAlign='center';c.textBaseline='middle';c.globalAlpha=span(t,5.2,5.8);
    [['N',-90],['E',0],['S',90],['W',180]].forEach(([s,d])=>{const a=d*Math.PI/180;c.fillText(s,cx+Math.cos(a)*R*1.13,cy+Math.sin(a)*R*1.13)});c.globalAlpha=1}
  // 指针 = 标准线：旋转、收拢、下移，之后阻尼摆动停在磁北
  const sw=t>5.4?.25*Math.exp(-3*(t-5.4))*Math.sin(9*(t-5.4)):0;
  const ang=mix(0,aT,p)+sw,ux=Math.cos(ang),uy=Math.sin(ang),nx=-uy,ny=ux;
  const px=mix(W/2,cx,p),py=mix(ly,cy,p),L1=mix(W*.4,R*.6,p),L2=mix(W*.4,R*.78,p);
  c.strokeStyle=BRASS;c.lineWidth=mix(2,3,p);glow(BRASS,18);
  line(px-ux*L1,py-uy*L1,px+ux*L2,py+uy*L2);noGlow();
  // 刻度：尺子时全部可见，收拢后只留少数并向指尖渐隐
  c.lineWidth=1.5;
  for(let i=0;i<=40;i++){const k=i/40,d=-L1+(L1+L2)*k,h=i%10===0?24:i%5===0?14:8;
    c.globalAlpha=(1-p)*.9+p*(i%4===0?.8*(1-k):0);if(c.globalAlpha<.01)continue;
    const x=px+ux*d,y=py+uy*d;line(x,y,x+nx*h*(1-p)+nx*h*p*.5,y+ny*h*(1-p)+ny*h*p*.5)}
  c.globalAlpha=1;
  // 尺子在量「那句话」：Ne 从同一起点分叉出多个版本，最好的那个碰到标准线；说出口的停在下面，红笔标出落差。旋转开始后收回
  const ox=W/2,oy=V()?H*.5:H*.6,fo=1-span(t,2.4,3.4);
  if(fo>0){
    const bp=ease(span(t,.2,1.3));
    [[-.3,.55],[-.16,.8],[.08,1],[.22,.7],[.34,.5]].forEach(([dx,h])=>{
      const best=h===1,tx=ox+dx*W,ty=mix(oy,ly,h),ex=mix(ox,tx,bp*fo),ey=mix(oy,ty,bp*fo);
      c.strokeStyle=best?BRASS:INK;c.fillStyle=c.strokeStyle;c.lineWidth=best?2:1.2;c.globalAlpha=(best?.9:.45)*fo;
      if(best)glow(BRASS,10);
      c.beginPath();c.moveTo(ox,oy);c.quadraticCurveTo(mix(ox,ex,.2),mix(oy,ey,.6),ex,ey);c.stroke();noGlow();
      c.beginPath();c.arc(ex,ey,best?5:3,0,Math.PI*2);c.fill();
      if(best&&bp>.95){c.font='500 20px '+MONO;c.textAlign='left';c.textBaseline='middle';c.fillText('想到的',ex+14,ey+24)}
    });
    // 说出口的那句：从起点升起，停在标准线下方
    const ap=ease(span(t,1,1.6)),ay=mix(oy,mix(oy,ly,.66),ap);
    c.globalAlpha=fo;c.strokeStyle='#E8E2D4';c.lineWidth=4;line(ox,oy,ox,ay);
    c.fillStyle=INK;c.beginPath();c.arc(ox,oy,6,0,Math.PI*2);c.fill();
    c.font='500 20px '+MONO;c.textAlign='center';c.textBaseline='top';c.fillText('那句话',ox,oy+18);
    if(ap>.95){c.fillStyle='#E8E2D4';c.textAlign='left';c.textBaseline='middle';c.fillText('说出口的',ox+18,ay)}
    // 红笔：标出落差
    const ra=ease(span(t,1.6,2))*fo;
    if(ra>0){const bx=ox-56;c.strokeStyle=RED;c.lineWidth=3;c.globalAlpha=ra;
      line(bx,ay,bx,ly+6);line(bx,ay,bx+16,ay);line(bx,ly+6,bx+16,ly+6);
      c.font='600 26px '+SERIF;c.fillStyle=RED;c.textAlign='right';c.textBaseline='middle';c.fillText('差一截',bx-14,(ay+ly)/2)}
    c.globalAlpha=1;
  }
  // 中心光点（Fi）
  if(p>0){c.fillStyle=BRASS;c.globalAlpha=p;glow(BRASS,24);c.beginPath();c.arc(cx,cy,7,0,Math.PI*2);c.fill();noGlow();c.globalAlpha=1}
  // 正北虚线、δ 弧、航线
  const fa=ease(span(t,7,7.8));
  if(fa>0){c.globalAlpha=fa;c.strokeStyle=INK;c.lineWidth=1.5;c.setLineDash([6,8]);line(cx,cy,cx,cy-R*1.02);c.setLineDash([]);
    c.strokeStyle=BRASS;c.lineWidth=1;c.beginPath();c.arc(cx,cy,R*.45,aT,-Math.PI/2);c.stroke();
    const la=-Math.PI/2+dec/2;c.font='italic 28px '+SERIF;c.fillStyle=BRASS;c.textAlign='center';c.textBaseline='middle';
    c.fillText('δ',cx+Math.cos(la)*R*.55,cy+Math.sin(la)*R*.55);c.globalAlpha=1}
  const ca=ease(span(t,7.6,8.4));
  if(V()&&ca>0){const y=H*.64,x0=W*.12,x1=mix(x0,W*.88,ca);c.strokeStyle=BRASS;c.lineWidth=1.5;c.globalAlpha=.7;
    c.setLineDash([10,8]);line(x0,y,x1,y);c.setLineDash([]);line(x1-14,y-8,x1,y);line(x1-14,y+8,x1,y);
    c.font='500 20px '+MONO;c.fillStyle=BRASS;c.textAlign='left';c.textBaseline='bottom';c.fillText('COURSE 349°',x0,y-12);c.globalAlpha=1}
  note('磁偏角 δ · 各地不同、逐年变化（待核实）',span(t,7.4,8));
  cue(t,1.6,3.2,['这样，够好了吗？']);
  cue(t,5.6,7.2,['这是，我在意的吗？']);
  cue(t,7.4,10.4,['罗盘从来不指正北。','指方向，不需要准。']);
}
// ---- 渲染 ----
let now=0;
function layout(){
  [W,H]=V()?[1080,1920]:[1920,1080];
  if(cv.width!==W||cv.height!==H){cv.width=W;cv.height=H}
  const ui=document.body.classList.contains('capture')?0:44;
  const k=Math.min(innerWidth/W,(innerHeight-ui)/H);
  const st=document.getElementById('stage');
  st.style.transform=`scale(${k}) translate(-50%,-50%)`;st.style.top=`calc(50% - ${ui/2}px)`;
  document.getElementById('ratio').textContent=V()?'9:16':'16:9';
}
function renderAt(t){
  now=clamp(Number(t)||0,0,D);
  c.setTransform(1,0,0,1,0,0);c.globalAlpha=1;noGlow();c.setLineDash([]);
  bg();draw(story(now));
  document.getElementById('seek').value=now;
  document.getElementById('time').textContent=now.toFixed(2)+'s';
}
window.renderAt=renderAt;

// ---- 播放与拖动 ----
let playing=false,t0=0,n0=0;
const btn=document.getElementById('play');
function tick(ts){
  if(!playing)return;
  const t=n0+(ts-t0)/1000;
  if(t>=D){renderAt(D);playing=false;btn.textContent='播放';return}
  renderAt(t);requestAnimationFrame(tick);
}
btn.onclick=()=>{
  playing=!playing;btn.textContent=playing?'暂停':'播放';
  if(playing){n0=now>=D?0:now;t0=performance.now();requestAnimationFrame(tick)}
};
document.getElementById('seek').oninput=e=>{playing=false;btn.textContent='播放';renderAt(+e.target.value)};
document.getElementById('ratio').onclick=()=>{RATIO=V()?'16x9':'9x16';layout();renderAt(now)};
addEventListener('resize',()=>{layout();renderAt(now)});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();btn.click()}});

// ---- 启动：?t= 指定时刻；字体就绪后置 window.ready ----
// window.ready：字体就绪、首帧画完后兑现的 Promise
window.ready=(document.fonts?document.fonts.ready:Promise.resolve()).then(()=>{
  layout();renderAt(q.has('t')?+q.get('t'):0);
});
</script>
</body>
</html>
